# One workflow, two jobs. This file used to be Deploy-only, with architecture
# checks in a separate deptrac.yml that ran in PARALLEL on the same push — so a
# deploy could ship code that failed the architecture gate, and a push showed up
# as one or two runs depending on whether it touched `app/**`. The gate is now a
# job the deploy `needs:`, so main can only deploy what passes.
name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Production deploys stay serialised (never cancel a half-finished deploy);
  # superseded PR checks are safe to drop.
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Gate: layer + module boundaries (the documented `composer deptrac`) ──────
  architecture:
    name: 🧭 Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: 🗂️ Locate composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: ♻️ Cache composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: 📦 Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      # Matches the documented local gate (`composer deptrac`). We do NOT pass
      # --fail-on-uncovered: the codebase intentionally leaves many classes
      # unlayered (~8k uncovered tokens), so that flag would always fail. This
      # still fails on real layer-boundary violations, and on baseline entries
      # that have gone stale.
      - name: 🧭 Run deptrac
        run: composer deptrac

  # ── Gate: the test suite ────────────────────────────────────────────────────
  # Added 17 Aug 2026. Before this, `architecture` was the ONLY gate: 900+ tests
  # existed and CI never ran them, so a regression could merge to main and deploy
  # with no automated verification beyond "composer install and npm run build
  # succeeded". Nine tests had been red on main for some time, unnoticed.
  #
  # MySQL 8 service rather than SQLite: phpunit.xml pins DB_CONNECTION=mysql, and
  # this codebase's bug classes (JSON_EXTRACT, FULLTEXT, dropped columns,
  # whereDate sargability) are MySQL-specific and invisible under SQLite.
  test:
    name: 🧪 Test suite
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: the_last_messenger_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: the_last_messenger_test
      DB_USERNAME: root
      DB_PASSWORD: ''
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, curl, zip, gd, bcmath, intl, redis, mysql
          tools: composer:v2
          coverage: none

      - name: 🗂️ Locate composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: ♻️ Cache composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: 📦 Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      # .env.example ships DB_CONNECTION=sqlite for local dev. The job-level env above
      # already wins (phpdotenv is immutable and will not override a real env var), but
      # write it into .env too so `artisan migrate` cannot silently pick sqlite if that
      # ever changes.
      - name: ⚙️ Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          php artisan key:generate

      - name: 🗄️ Migrate
        run: php artisan migrate --force --no-interaction

      - name: 🧪 Run tests
        run: php artisan test

  # ── Informational: code style ───────────────────────────────────────────────
  # Pint is a dev dependency that has never been wired up, and ~110 files across
  # database/, config/, resources/lang/ and app/ currently fail `pint --test` on
  # whitespace, import order and fully-qualified-type rules only — nothing semantic.
  #
  # Deliberately NOT in `deploy.needs` yet: making it blocking today would fail every
  # deploy, and reformatting 110 files in one sweep would collide with in-flight work.
  # Run `vendor/bin/pint` once as its own commit (Phase 5 / T5.4), then add `style` to
  # the deploy gate. Until then this job reports drift without blocking.
  style:
    name: 🎨 Pint (informational)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: 📦 Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: 🎨 Check formatting
        run: vendor/bin/pint --test

  # ── Deploy: only after every gate passes, and never from a pull request ─────
  deploy:
    name: 🚀 Build & Deploy
    needs: [architecture, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      # --- Build front-end assets on the runner (Vite). ---
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install JS deps
        run: npm ci

      - name: 🏗️ Build assets
        run: npm run build

      # --- Validate PHP can install (fast fail before touching the server). ---
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, curl, zip, gd, bcmath, intl, redis, mysql
          coverage: none

      - name: ✅ Composer validate + install (no-dev dry check)
        run: |
          composer validate --no-check-publish
          # --no-scripts: the runner has no app .env, so don't boot the app
          # (artisan package:discover). Dependency resolution/install is what we
          # validate here; the server deploy runs the post-install scripts.
          composer install --no-dev --prefer-dist --no-progress --no-interaction --no-scripts

      # --- Package release artifact (exclude dev/local-only paths). ---
      - name: 📦 Zip release
        run: |
          zip -rq /tmp/tlm-release.zip . \
            -x "node_modules/*" \
            -x ".git/*" \
            -x "storage/*" \
            -x "tests/*" \
            -x "deploy/config.env" \
            -x ".env" \
            -x ".github/*"

      # --- Ship to the server and run the zero-downtime deploy script. ---
      - name: 🔑 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # NOTE: no ssh-keyscan here on purpose — scp/ssh below use
      # StrictHostKeyChecking=no, and keyscan's probe of multiple key types
      # produces "Connection closed [preauth]" log lines that can trip fail2ban
      # and ban the runner.
      - name: 📡 Upload artifact
        run: |
          scp -o StrictHostKeyChecking=no \
            /tmp/tlm-release.zip deploy/deploy/deploy.sh \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_SERVER_IP }}:/tmp/

      - name: 🚀 Deploy
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_SERVER_IP }} \
            "chmod 0755 /tmp/deploy.sh && \
             /tmp/deploy.sh /tmp/tlm-release.zip ${{ github.sha }} && \
             rm -f /tmp/deploy.sh"

      - name: 🧹 Cleanup local artifact
        if: always()
        run: rm -f /tmp/tlm-release.zip
