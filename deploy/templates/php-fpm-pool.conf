; The Last Messenger — PHP-FPM pool (rendered from template; do not hand-edit).
; Tuned for 4GB RAM / 2 vCPU. ~70MB per worker -> max_children=${PHP_FPM_MAX_CHILDREN}.
[www]
user = www-data
group = www-data
listen = /run/php/php${PV}-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE}
; Recycle workers to bound memory leaks.
pm.max_requests = 500

; Kill runaway requests (matches nginx fastcgi_read_timeout).
request_terminate_timeout = 120s

; Status + ping endpoints (consumed by stage 90 health check; not exposed by nginx).
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Per-pool slow log for diagnosing slow endpoints.
slowlog = /var/log/php${PV}-fpm-slow.log
request_slowlog_timeout = 5s

; Pass through only the env vars the app may read.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
