; The Last Messenger — view-tracking worker (the `tracking` queue).
;
; RecordMediaViewJob dispatches here: tiny jobs (one event insert + one counter
; UPDATE) but bursty with page traffic. Kept off the default queue so a view
; burst never queues behind bulk operations, and off `sync` so playlist imports
; never starve view counting.
;
;   --tries=1     the recorder consumed the hourly dedupe slot before dispatch;
;                 a retry would double-count. Losing one view on a rare failure
;                 is the correct trade.
;   --max-jobs   high: jobs are milliseconds each, recycle hourly via max-time.
[program:tlm-tracking-worker]
process_name=%(program_name)s_%(process_num)02d
command=${PHP_BIN} ${APP_DIR}/current/artisan queue:work ${QUEUE_CONNECTION} --queue=tracking --sleep=3 --tries=1 --timeout=30 --max-time=3600 --max-jobs=10000
directory=${APP_DIR}/current
autostart=true
autorestart=true
; A worker that cannot reach MySQL exits immediately. With supervisor defaults
; (startsecs=1, startretries=3) three such exits mark the program FATAL for good
; — which is how every queue stays silently dead after a reboot that brings
; MySQL up late, while the site itself looks perfectly healthy. Require 10s of
; uptime to count as a real start, and keep retrying well past a slow boot.
startsecs=10
startretries=20
stopasgroup=true
killasgroup=true
user=${DEPLOY_USER}
numprocs=${TRACKING_QUEUE_WORKERS}
redirect_stderr=true
stdout_logfile=${APP_DIR}/shared/storage/logs/tracking-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=60
