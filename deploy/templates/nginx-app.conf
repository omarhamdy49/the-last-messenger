# The Last Messenger — shared Laravel location block (included by both server blocks).
# NOTE: `root` and `server_name` are set by the including server block.

index index.php;
charset utf-8;

# Front controller.
location / {
    try_files $uri $uri/ /index.php?$query_string;
    limit_conn perip 20;
}

# Public API: rate-limited (defence in depth alongside Laravel throttles).
location /api/ {
    try_files $uri $uri/ /index.php?$query_string;
    limit_req zone=api burst=60 nodelay;
    limit_conn perip 20;
}

# Login / token endpoints: strict rate limit.
location ~ ^/(api/v1/auth/(login|register)|su/portal/v1/admin/login) {
    try_files $uri $uri/ /index.php?$query_string;
    limit_req zone=login burst=5 nodelay;
}

# PHP-FPM.
location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass unix:/run/php/php${PHP_VERSION}-fpm.sock;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 120s;
    # 16x16k = 256KB was not enough for the Blade pages that inline critical CSS: anything
    # larger spills into fastcgi_temp on disk AND holds the fpm child open until the
    # response fully drains, so a slow client occupies a PHP worker.
    fastcgi_buffers 16 32k;
    fastcgi_buffer_size 32k;
    fastcgi_busy_buffers_size 64k;
}

# Long-cache built assets (Vite fingerprints filenames).
location ~* \.(?:css|js|woff2?|ttf|eot|otf|svg|gif|png|jpe?g|webp|avif|ico)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable";
    # nginx's add_header does NOT merge with inherited ones — declaring ANY add_header in a
    # nested block discards every add_header from the enclosing server block. So the single
    # Cache-Control above was silently stripping HSTS, X-Frame-Options, nosniff,
    # Referrer-Policy, X-XSS-Protection and Permissions-Policy from every .js/.css/image
    # response. Re-emitted here to match nginx-https.conf.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    try_files $uri /index.php?$query_string;
}

location = /favicon.ico { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }

# robots.txt is served DYNAMICALLY by Laravel (routes/web.php:96) so the Sitemap
# directive can use the real request host. Without try_files this exact-match block made
# nginx look for public/robots.txt, which does not exist, and return 404 before Laravel
# ever saw the request — every crawler was getting a 404 for robots.txt. It does not fall
# into the static-asset regex above either, because `.txt` is not in that extension list.
# Found by the k6 load test: all 137 of its "failures" were this one URL.
location = /robots.txt  { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }

# Block access to hidden/sensitive files (.env, .git, dotfiles).
location ~ /\.(?!well-known).* { deny all; }
location ~* \.(env|log|sql|sqlite|bak|ini|sh|lock|yaml|yml|md)$ { deny all; }
# Never execute PHP uploaded into storage.
location ~* ^/storage/.*\.php$ { deny all; }
