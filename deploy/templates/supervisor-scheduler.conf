; The Last Messenger — Laravel scheduler.
; `schedule:work` runs the scheduler in the foreground (invokes schedule:run
; every minute), driving the app's Schedule facade jobs:
;   - articles:publish-scheduled  (every minute)
;   - content:process-scheduled   (every 5 min)
;   - media:publish-scheduled     (hourly)
;   - quran:ai-prune              (daily 03:30)
[program:tlm-scheduler]
process_name=%(program_name)s
command=${PHP_BIN} ${APP_DIR}/current/artisan schedule:work
directory=${APP_DIR}/current
autostart=true
autorestart=true
user=${DEPLOY_USER}
numprocs=1
redirect_stderr=true
stdout_logfile=${APP_DIR}/shared/storage/logs/scheduler.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=60
