# The Last Messenger — HTTP server block (pre-TLS / ACME).
# Stage 70-ssl replaces this file with nginx-https.conf once a cert is issued.
server {
    listen 80;
    listen [::]:80;
    server_name ${APP_DOMAIN} ${APP_WWW};

    root ${APP_DIR}/current/public;

    access_log /var/log/nginx/${APP_DOMAIN}.access.log;
    error_log  /var/log/nginx/${APP_DOMAIN}.error.log;

    # ACME HTTP-01 challenge (served from a stable webroot).
    location ^~ /.well-known/acme-challenge/ {
        root ${ACME_WEBROOT};
        default_type "text/plain";
        allow all;
    }

    include /etc/nginx/snippets/tlm-app.conf;
}
