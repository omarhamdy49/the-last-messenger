; The Last Messenger — queue workers.
; Processes the database-backed queue. max-time recycles workers hourly to bound
; memory; --tries + backoff retries transient failures safely.
[program:tlm-worker]
process_name=%(program_name)s_%(process_num)02d
command=${PHP_BIN} ${APP_DIR}/current/artisan queue:work ${QUEUE_CONNECTION} --queue=default --sleep=3 --tries=3 --backoff=10 --max-time=3600 --max-jobs=1000
directory=${APP_DIR}/current
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=${DEPLOY_USER}
numprocs=${QUEUE_WORKERS}
redirect_stderr=true
stdout_logfile=${APP_DIR}/shared/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3600
