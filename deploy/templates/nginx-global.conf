# The Last Messenger — global Nginx tuning (http{} context, additive only).
# NOTE: Ubuntu's stock nginx.conf already sets sendfile, tcp_nopush, gzip on,
# ssl_protocols (TLSv1.2/1.3), ssl_prefer_server_ciphers, and server_tokens.
# Re-declaring those here is a duplicate-directive error, so this file only adds
# what stock does NOT set. (server_tokens is flipped to "off" by stage 65.)

# Upload ceiling (matches PHP upload_max_filesize for media uploads).
client_max_body_size ${PHP_UPLOAD_MAX};
client_body_timeout 30s;
client_header_timeout 30s;
send_timeout 30s;
keepalive_timeout 30s;
# Stock default is 1000, which forces a fresh TLS handshake every 1000 requests on each
# Cloudflare edge connection. Behind a CDN those connections are long-lived and carry far
# more than 1000 requests, so the renegotiation is pure overhead.
keepalive_requests 10000;

# --- gzip tuning (stock enables `gzip on`; this adds the rest) ---
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
  text/plain text/css text/xml application/json application/javascript
  application/xml application/xml+rss application/rss+xml
  application/vnd.ms-fontobject application/x-font-ttf font/opentype
  image/svg+xml image/x-icon;

# --- TLS session resumption + OCSP stapling (protocols/ciphers set in stock) ---
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;

# --- Static-file serving perf ---
open_file_cache max=10000 inactive=60s;
open_file_cache_valid 120s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

# --- Rate-limit zones (consumed by server blocks). ---
# Public API: aligns with app throttle:search/auth defences (defence in depth).
limit_req_zone $binary_remote_addr zone=api:10m   rate=30r/s;
# Auth/login endpoints: strict.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
# Cap concurrent connections per IP.
limit_conn_zone $binary_remote_addr zone=perip:10m;
