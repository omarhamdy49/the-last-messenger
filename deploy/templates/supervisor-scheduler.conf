; The Last Messenger — Laravel scheduler.
; `schedule:work` runs the scheduler in the foreground, invoking schedule:run
; every minute. There is deliberately NO crontab entry: the schedule is declared
; in routes/console.php (Schedule facade), so adding or retiming a task is a
; code change that ships with a normal deploy — nothing to edit on the server.
; `php artisan schedule:list` is the authoritative list; it is not repeated here
; because a copy in this file only ever drifts.
[program:tlm-scheduler]
process_name=%(program_name)s
command=${PHP_BIN} ${APP_DIR}/current/artisan schedule:work
directory=${APP_DIR}/current
autostart=true
autorestart=true
; A worker that cannot reach MySQL exits immediately. With supervisor defaults
; (startsecs=1, startretries=3) three such exits mark the program FATAL for good
; — which is how every queue stays silently dead after a reboot that brings
; MySQL up late, while the site itself looks perfectly healthy. Require 10s of
; uptime to count as a real start, and keep retrying well past a slow boot.
startsecs=10
startretries=20
user=${DEPLOY_USER}
numprocs=1
redirect_stderr=true
stdout_logfile=${APP_DIR}/shared/storage/logs/scheduler.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=60
