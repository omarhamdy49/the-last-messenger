; The Last Messenger — YouTube import worker (the `sync` queue).
;
; Kept separate from tlm-worker on purpose. SyncYouTubePlaylistJob dispatches to
; `sync` and runs yt-dlp once per video (metadata + subtitles + thumbnail), so a
; playlist import occupies a worker for many minutes. On the shared default
; queue it would starve short jobs behind it.
;
; Differences from the default worker, all consequences of that runtime:
;   --timeout / stopwaitsecs   sized for a full playlist, not a single request
;   --tries=1                  the import is resumable by design (episodes are
;                              matched on YouTube video id, so re-running
;                              updates in place); a blind retry would re-fetch
;                              everything and double the API load for nothing
;   --max-jobs=50              recycle sooner; yt-dlp is memory-hungry
[program:tlm-sync-worker]
process_name=%(program_name)s_%(process_num)02d
command=${PHP_BIN} ${APP_DIR}/current/artisan queue:work ${QUEUE_CONNECTION} --queue=sync --sleep=5 --tries=1 --timeout=${SYNC_QUEUE_TIMEOUT} --max-time=3600 --max-jobs=50
directory=${APP_DIR}/current
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=${DEPLOY_USER}
numprocs=${SYNC_QUEUE_WORKERS}
redirect_stderr=true
stdout_logfile=${APP_DIR}/shared/storage/logs/sync-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
; Must exceed --timeout so supervisor never SIGKILLs an import mid-flight.
stopwaitsecs=${SYNC_QUEUE_STOPWAIT}
