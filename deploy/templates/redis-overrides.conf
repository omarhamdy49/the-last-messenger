# The Last Messenger — Redis overrides (cache + session). Loaded via include.
# Bind to loopback only; the firewall also blocks 6379 externally.
bind 127.0.0.1 -::1
protected-mode yes
port 6379

# Authentication.
requirepass ${REDIS_PASSWORD}

# Memory: cap and evict least-recently-used keys. Safe because Redis here holds
# only regenerable cache + sessions (the durable queue lives in MySQL).
maxmemory ${REDIS_MAXMEMORY}
maxmemory-policy allkeys-lru

# Persistence disabled: this instance is a cache, not a system of record.
# Avoids fork/IO overhead and disk churn on a small box.
save ""
appendonly no

# Managed by systemd.
supervised systemd

# Block the most destructive command in a shared-host context. (CONFIG is left
# intact so health checks and ops tooling keep working.)
rename-command FLUSHALL ""
