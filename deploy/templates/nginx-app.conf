# The Last Messenger — shared Laravel location block (included by both server blocks).
# NOTE: `root` and `server_name` are set by the including server block.

index index.php;
charset utf-8;

# Front controller.
location / {
    try_files $uri $uri/ /index.php?$query_string;
    limit_conn perip 20;
}

# Public API: rate-limited (defence in depth alongside Laravel throttles).
location /api/ {
    try_files $uri $uri/ /index.php?$query_string;
    limit_req zone=api burst=60 nodelay;
    limit_conn perip 20;
}

# Login / token endpoints: strict rate limit.
location ~ ^/(api/v1/auth/(login|register)|su/portal/v1/admin/login) {
    try_files $uri $uri/ /index.php?$query_string;
    limit_req zone=login burst=5 nodelay;
}

# PHP-FPM.
location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass unix:/run/php/php${PHP_VERSION}-fpm.sock;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 120s;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
}

# Long-cache built assets (Vite fingerprints filenames).
location ~* \.(?:css|js|woff2?|ttf|eot|otf|svg|gif|png|jpe?g|webp|avif|ico)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri /index.php?$query_string;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }

# Block access to hidden/sensitive files (.env, .git, dotfiles).
location ~ /\.(?!well-known).* { deny all; }
location ~* \.(env|log|sql|sqlite|bak|ini|sh|lock|yaml|yml|md)$ { deny all; }
# Never execute PHP uploaded into storage.
location ~* ^/storage/.*\.php$ { deny all; }
