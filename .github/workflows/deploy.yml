# One workflow: three fast gates (architecture, critical tests, Pint) the deploy
# needs, plus a full-suite report that runs alongside without holding it.
# Originally: This file used to be Deploy-only, with architecture
# checks in a separate deptrac.yml that ran in PARALLEL on the same push — so a
# deploy could ship code that failed the architecture gate, and a push showed up
# as one or two runs depending on whether it touched `app/**`. The gate is now a
# job the deploy `needs:`, so main can only deploy what passes.
name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Production deploys stay serialised (never cancel a half-finished deploy);
  # superseded PR checks are safe to drop.
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Gate: layer + module boundaries (the documented `composer deptrac`) ──────
  architecture:
    name: 🧭 Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: ♻️ Cache vendor
        id: vendor-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php85-vendor-${{ hashFiles('**/composer.lock') }}

      - name: 📦 Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      # Matches the documented local gate (`composer deptrac`). We do NOT pass
      # --fail-on-uncovered: the codebase intentionally leaves many classes
      # unlayered (~8k uncovered tokens), so that flag would always fail. This
      # still fails on real layer-boundary violations, and on baseline entries
      # that have gone stale.
      - name: 🧭 Run deptrac
        run: composer deptrac

  # ── Gate: critical tests (seconds, blocks deploy) ───────────────────────────
  # The full suite is ~1,270 tests and took ~5 minutes per push, most of it in
  # composer install, a second migration pass and tests that guard editorial
  # detail rather than production safety. The deploy now waits only for the
  # `Critical` suite in phpunit.xml: auth/authorization boundaries, public
  # visibility, API security, admin/API route smoke, and the unit layer. The
  # full suite still runs on every push in `test-full` below, but does not
  # hold the deploy.
  #
  # MySQL 8 service rather than SQLite: phpunit.xml pins DB_CONNECTION=mysql, and
  # this codebase's bug classes (JSON_EXTRACT, FULLTEXT, dropped columns,
  # whereDate sargability) are MySQL-specific and invisible under SQLite.
  test:
    name: 🧪 Critical tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: the_last_messenger_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=30
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: the_last_messenger_test
      DB_USERNAME: root
      DB_PASSWORD: ''
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, curl, zip, gd, bcmath, intl, redis, mysql
          tools: composer:v2
          coverage: none

      # The whole vendor tree is cached on composer.lock, so a push that does not
      # change dependencies skips `composer install` entirely (restore is seconds).
      - name: ♻️ Cache vendor
        id: vendor-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php85-vendor-${{ hashFiles('**/composer.lock') }}

      - name: 📦 Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      # .env.example ships DB_CONNECTION=sqlite for local dev. The job-level env above
      # already wins (phpdotenv is immutable and will not override a real env var), but
      # write it into .env too so nothing can silently pick sqlite if that ever changes.
      - name: ⚙️ Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          php artisan key:generate

      # No explicit `artisan migrate` here: every test class uses RefreshDatabase,
      # which migrates the fresh database itself on first use. Running it twice
      # was pure cost.
      - name: 🧪 Run critical tests
        run: php artisan test --testsuite=Critical --stop-on-failure

  # ── Report: full suite (every push, does not block deploy) ──────────────────
  # Same environment as the gate. Red here is a real regression to fix, but it
  # surfaces as a failed check on the commit/PR rather than a held deploy.
  test-full:
    name: 🧪 Full suite (non-blocking)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: the_last_messenger_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=30
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: the_last_messenger_test
      DB_USERNAME: root
      DB_PASSWORD: ''
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, curl, zip, gd, bcmath, intl, redis, mysql
          tools: composer:v2
          coverage: none

      - name: ♻️ Cache vendor
        id: vendor-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php85-vendor-${{ hashFiles('**/composer.lock') }}

      - name: 📦 Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: ⚙️ Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          php artisan key:generate

      - name: 🧪 Run full suite
        run: php artisan test

  # ── Gate: code style (baseline cleared 13 Sep 2026) ─────────────────────────
  style:
    name: 🎨 Pint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: ♻️ Cache vendor
        id: vendor-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php85-vendor-${{ hashFiles('**/composer.lock') }}

      - name: 📦 Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: 🎨 Check formatting
        run: vendor/bin/pint --test

  # ── Deploy: only after every gate passes, and never from a pull request ─────
  deploy:
    name: 🚀 Build & Deploy
    needs: [architecture, test, style]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      # --- Build front-end assets on the runner (Vite). ---
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install JS deps
        run: npm ci

      - name: 🏗️ Build assets
        run: npm run build

      # --- Validate PHP can install (fast fail before touching the server). ---
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, curl, zip, gd, bcmath, intl, redis, mysql
          coverage: none

      - name: ✅ Composer validate + install (no-dev dry check)
        run: |
          composer validate --no-check-publish
          # --no-scripts: the runner has no app .env, so don't boot the app
          # (artisan package:discover). Dependency resolution/install is what we
          # validate here; the server deploy runs the post-install scripts.
          composer install --no-dev --prefer-dist --no-progress --no-interaction --no-scripts

      # --- Package release artifact (exclude dev/local-only paths). ---
      - name: 📦 Zip release
        run: |
          zip -rq /tmp/tlm-release.zip . \
            -x "node_modules/*" \
            -x ".git/*" \
            -x "storage/*" \
            -x "tests/*" \
            -x "deploy/config.env" \
            -x ".env" \
            -x ".github/*"

      # --- Ship to the server and run the zero-downtime deploy script. ---
      - name: 🔑 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # NOTE: no ssh-keyscan here on purpose — scp/ssh below use
      # StrictHostKeyChecking=no, and keyscan's probe of multiple key types
      # produces "Connection closed [preauth]" log lines that can trip fail2ban
      # and ban the runner.
      - name: 📡 Upload artifact
        run: |
          scp -o StrictHostKeyChecking=no \
            /tmp/tlm-release.zip deploy/deploy/deploy.sh \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_SERVER_IP }}:/tmp/

      - name: 🚀 Deploy
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_SERVER_IP }} \
            "chmod 0755 /tmp/deploy.sh && \
             /tmp/deploy.sh /tmp/tlm-release.zip ${{ github.sha }} && \
             rm -f /tmp/deploy.sh"

      - name: 🧹 Cleanup local artifact
        if: always()
        run: rm -f /tmp/tlm-release.zip
